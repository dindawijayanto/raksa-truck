[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-fleet-analytics"
version = "0.1.0"
description = "Reusable road-roughness and contextual-wear analytics for AIC."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "catboost>=1.2",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "xgboost>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
